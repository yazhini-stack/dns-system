# ==============================================================================
#  DNS Server & Resolver Configuration
# ==============================================================================

# Server Network Settings
# Default UDP/TCP port is 5353 (avoids requiring administrative/root rights)
server.port=5353
server.host=0.0.0.0
server.tcp.enabled=true

# Upstream Recursive Resolvers (comma separated host:port)
upstream.servers=8.8.8.8:53,1.1.1.1:53
upstream.timeout.ms=2000

# Cache Settings
cache.enabled=true
cache.max_size=10000
cache.negative_ttl_seconds=300

# Filtering & Ad/Malware Blocking
blocking.enabled=true
# Mode: "ip" (returns 0.0.0.0 for A, :: for AAAA) or "nxdomain" (returns NXDOMAIN)
blocking.mode=ip
blocking.ip4=0.0.0.0
blocking.ip6=::
blocking.filepath=blocklists/sample.txt

# Authoritative Zone File
zone.filepath=zones/local.zone

# Rate Limiting (per client IP)
ratelimit.enabled=true
ratelimit.requests_per_second=50

# Worker Thread Pool
threads.pool_size=16

# Logging
log.filepath=logs/dns-queries.log
